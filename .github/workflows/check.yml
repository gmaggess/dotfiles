name: Public configuration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check-public.py
      - name: Scan published history for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          case "$(uname -m)" in
            arm64) asset=gitleaks_8.30.1_darwin_arm64.tar.gz; checksum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            x86_64) asset=gitleaks_8.30.1_darwin_x64.tar.gz; checksum=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709 ;;
            *) echo 'Unsupported runner architecture' >&2; exit 1 ;;
          esac
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern "$asset" --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          echo "$checksum  $asset" | shasum -a 256 -c -
          tar -xzf "$asset" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts='--all' --redact --no-banner
